<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch Challenge: AI Service Status</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-1">AI Service Status</h1>
    <p id="status" class="text-secondary">Loading services...</p>

    <form id="search-form" class="input-group mb-4">
      <input
        id="search-input"
        type="search"
        class="form-control"
        placeholder="Search by service name or status"
        autocomplete="off"
      >
      <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <div id="service-list" class="row g-3"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
