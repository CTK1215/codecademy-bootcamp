<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Creation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1>Account Creation</h1>
    <p>Create your account by filling out the form below.</p>
  </header>

  <main class="container">
    <form class="account-form">
      <div class="field">
        <label for="firstName">First name</label>
        <input id="firstName" name="firstName" type="text" placeholder= "John" required />
      </div>

      <div class="field">
        <label for="lastName">Last name</label>
        <input id="lastName" name="lastName" type="text" placeholder= "Doe" required />
      </div>

      <div class="field">
        <label for="dob">Date of birth</label>
        <input id="dob" name="dob" type="date" required />
      </div>

      <div class="field">
        <label for="ssn">Social Security Number</label>
        <input id="ssn" name="ssn" type="password" inputmode="numeric" required />
      </div>

      <div class="field">
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" required />
      </div>

      <div class="field field--full">
        <label for="address">Address</label>
        <input id="address" name="address" type="text" autocomplete="street-address"required />
      </div>

      <div class="field">
        <label for="city">City</label>
        <input id="city" name="city" type="text" autocomplete="address-level2" required />
      </div>

      <div class="field">
        <label for="state">State</label>
        <input id="state" name="state" type="text" maxlength="2" autocomplete="address-level2" required />
      </div>

      <div class="field">
        <label for="zip">ZIP code</label>
        <input id="zip" name="zip" type="text" inputmode="numeric" autocomplete="postal-code" required />
      </div>

      <div class="field field--full">
        <label class="checkbox">
          <input type="checkbox" required />
          I agree to the Terms
        </label>
      </div>

      <div class="field field--full">
        <button type="submit">Create Account</button>
      </div>
    </form>
  </main>

</body>
</html>
